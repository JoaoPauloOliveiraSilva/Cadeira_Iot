---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-vigilance
  namespace: iot-surveillance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-vigilance
  template:
    metadata:
      labels:
        app: api-vigilance
    spec:
      containers:
        - name: api
          image: iot-surveillance-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: API_KEY_EDGE
              valueFrom:
                secretKeyRef:
                  name: iot-surveillance-secrets
                  key: API_KEY_EDGE
            - name: API_KEY_DASHBOARD
              valueFrom:
                secretKeyRef:
                  name: iot-surveillance-secrets
                  key: API_KEY_DASHBOARD
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: iot-surveillance-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iot-surveillance-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iot-surveillance-secrets
                  key: INFLUX_TOKEN
            - name: INFLUX_ORG
              value: uminho_mei
            - name: INFLUX_BUCKET
              value: vigilancia
            - name: INFLUXDB_URL
              value: http://influxdb-service-vigilance:8086
            - name: MINIO_URL
              value: minio-service-vigilance:9000
            - name: MINIO_BUCKET
              value: iotproject
            - name: MINIO_SECURE
              value: "false"
            - name: CORS_ORIGINS
              value: http://localhost:3000,http://localhost:5173,http://100.118.101.103:5173
            - name: MQTT_ENABLED
              value: "true"
            - name: MQTT_BROKER
              value: mqtt-service
            - name: MQTT_PORT
              value: "1883"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-service-vigilance
  namespace: iot-surveillance
spec:
  type: NodePort
  selector:
    app: api-vigilance
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 32080